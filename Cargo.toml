[package]
name = "vyges-gds-view"
version = "0.1.55"
edition = "2021"
description = "Headless GDS layout viewer: a GDS in, a layered SVG out — with optional violation overlay."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/gds-view"

# No third-party deps (builds/tests offline). The GDS / geometry kernel comes from
# the vyges-layout foundation — the same kernel vyges-lvs and vyges-drc ride on.
[features]
# The command-line entry built into the library too (`cli_main`), for the suite binaries
# that link every engine and run the one they are invoked as.
suite = []

[dependencies]
vyges-layout = { git = "https://github.com/vyges-tools/layout", branch = "main" }
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false }

[[bin]]
name = "vyges-gds-view"
path = "src/main.rs"

[lib]
name = "vyges_gds_view"
path = "src/lib.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "forbid"

[lints.clippy]
ptr_arg = "warn"
borrowed_box = "warn"
len_without_is_empty = "warn"
new_without_default = "warn"
wrong_self_convention = "warn"
should_implement_trait = "warn"
type_complexity = "allow"
